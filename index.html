<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segurança Digital para Idosos</title>
    
    <style>
        /* --- ESTILOS GERAIS DA PÁGINA --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            padding: 30px;
            background-color: #f4f4f9;
            font-size: 1.3rem; /* Fonte maior para facilitar leitura */
        }

        h1 {
            color: #1e3a8a;
            margin-bottom: 15px;
        }

        p {
            margin-bottom: 25px;
            color: #333;
        }

        /* Botão de ajuda ajustado para o padrão do roteiro (Vermelho e chamativo) */
        .btn-ajuda {
            padding: 15px 30px;
            font-size: 1.4rem;
            background-color: #dc2626; 
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }

        .btn-ajuda:hover {
            background-color: #b91c1c;
        }

        /* --- ESTILOS DO MODAL E OVERLAY --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(5px); 
            z-index: 999;
            
            /* Exibição oculta por padrão */
            display: none; 
            justify-content: center;
            align-items: center;
        }

        /* Classe ativada via JavaScript */
        .modal-overlay.active {
            display: flex !important;
        }

        .modal-container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            max-width: 90%;
            width: 550px;
            text-align: center;
        }

        .modal-container h2 {
            color: #1e3a8a;
            margin-bottom: 15px;
        }

        .btn-fechar {
            margin-top: 25px;
            padding: 12px 24px;
            font-size: 1.1rem;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .btn-fechar:hover {
            background-color: #bd2130;
        }
    </style>
</head>
<body>

    <h1>Segurança Digital para Idosos</h1>
    <p>Bem-vindo ao portal. Clique no botão abaixo se precisar de auxílio com a navegação.</p>
